name: Publish Emberwild V3 preview

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emberwild-v3-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build V3 static preview
        env:
          STATIC_CDN_PREFIX: https://raw.githack.com/tilkitaha/Emberwild/v3-preview
        run: npx next build

      - name: Publish V3 preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: v3-preview
          force_orphan: true
