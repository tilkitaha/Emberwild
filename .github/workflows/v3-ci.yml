name: Emberwild V3 CI

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build V3
        run: npx next build
      - name: Run game tests
        run: node --test tests/*.test.mjs
